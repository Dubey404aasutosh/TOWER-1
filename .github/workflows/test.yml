name: E-Rakshak CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pandas networkx scikit-learn reportlab openpyxl pdfplumber faker

      - name: Generate Base Synthetic Data
        run: |
          python backend/data/generator/generate_all.py --scale 1

      - name: Run Pytest Test Suite
        run: |
          python -m pytest backend/tests/ backend/verification/
